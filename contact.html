<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <!-- Welcome User -->
    <div id="welcomeUser"></div>

    <h1>Caravan Beauty Salon</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="booking.html">Booking</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
    </nav>

</header>


<!-- Contact Section -->
<section class="contact">

    <h2>Contact Us</h2>

    <div class="contact-info">

        <p>
            <strong>📍 Location:</strong>
            Muscat, Oman
        </p>

        <p>
            <strong>📞 Phone:</strong>
            +968 9000 0000
        </p>

        <p>
            <strong>📧 Email:</strong>
            info@caravanbeauty.com
        </p>

        <p>
            <strong>🕒 Working Hours:</strong>
            9:00 AM - 9:00 PM
        </p>

    </div>


    <!-- Contact Form -->
    <form>

        <input
            type="text"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            placeholder="Email Address"
            required
        >

        <input
            type="tel"
            placeholder="Phone Number"
        >

        <textarea
            placeholder="Write your message..."
            rows="6">
        </textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>


<!-- Map -->
<section>

    <h2>Find Us</h2>

    <div class="map">

        <iframe
            src="https://www.google.com/maps?q=Muscat,Oman&output=embed"
            width="100%"
            height="400"
            style="border:0;"
            allowfullscreen=""
            loading="lazy">
        </iframe>

    </div>

</section>


<!-- Social Media -->
<div class="social-icons">

    <a href="#">📷 Instagram</a>

    <a href="#">💬 WhatsApp</a>

    <a href="#">📘 Facebook</a>

    <a href="#">▶ YouTube</a>

</div>


<!-- JavaScript -->
<script src="js/script.js"></script>

</body>
</html>
