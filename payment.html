<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div id="welcomeUser"></div>
    <h1>Caravan Beauty Salon</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="booking.html">Booking</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="payment">
    <h2>Complete Your Payment</h2>

    <form id="paymentForm">
        <label>Card Holder Name</label>
        <input type="text" placeholder="Enter Card Holder Name" required>

        <label>Card Number</label>
        <input type="text" placeholder="1234 5678 9012 3456" maxlength="19" required>

        <label>Expiry Date</label>
        <input type="month" required>

        <label>CVV</label>
        <input type="password" placeholder="123" maxlength="3" required>

        <label>Total Amount</label>
        <input type="text" id="totalAmount" value="OMR 0" readonly>

        <button type="submit">Pay Now</button>
    </form>
</section>

<script src="js/script.js"></script>
</body>
</html>
