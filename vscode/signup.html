<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-body">

<div class="login-card">

    <h2>Create Account</h2>

    <p>Join Caravan Beauty Salon</p>

    <form id="signupForm">

        <input
            type="text"
            id="fullName"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            id="signupEmail"
            placeholder="Email Address"
            required
        >

        <input
            type="tel"
            id="phone"
            placeholder="Phone Number"
            required
        >

        <input
            type="password"
            id="signupPassword"
            placeholder="Password"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>


<!-- JavaScript -->
<script src="../js/script.js"></script>

</body>
</html>
